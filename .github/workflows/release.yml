name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            extension: dmg
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: dmg
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            extension: zip
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check package version
        id: version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Cargo.toml must declare a version in X.Y.Z format.'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag must be v$version to match Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
          enable-cache: false

      - name: Set up Rust
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$RUST_TARGET"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev fontconfig

      - name: Package Linux
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: ./scripts/package-macos.sh

      - name: Install Inno Setup and package Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.4.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1') {
              throw 'Inno Setup installer checksum mismatch'
          }
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed ($($install.ExitCode))" }
          $compiler = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing' }
          ./scripts/package-windows.ps1 -ISCC $compiler

      - name: Verify and list packages
        id: packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          package="dist/ESP32-SuperFlash-$VERSION-$PLATFORM"
          files=("$package.$EXTENSION")
          if [[ "$RUNNER_OS" == Windows ]]; then
            files+=("$package-setup.exe")
          fi
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty package: $file"
              exit 1
            fi
          done
          {
            echo 'paths<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: superflash-${{ matrix.platform }}
          path: ${{ steps.packages.outputs.paths }}
          if-no-files-found: error
          overwrite: true

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for all build artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          platforms=(macos-aarch64 macos-x86_64 windows-x86_64 linux-x86_64 linux-aarch64)
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"
          # A finished upload can take a moment to appear in the run's artifact list.
          for attempt in {1..12}; do
            if inventory=$(gh api "$endpoint"); then
              ids=()
              missing=()
              for platform in "${platforms[@]}"; do
                name="superflash-$platform"
                id=$(jq -r --arg name "$name" '
                  [.artifacts[] | select(.name == $name and (.expired | not))]
                  | max_by(.id).id // empty
                ' <<< "$inventory")
                if [[ -n "$id" ]]; then
                  ids+=("$id")
                else
                  missing+=("$name")
                fi
              done
              if (( ${#missing[@]} == 0 )); then
                (IFS=,; echo "ids=${ids[*]}") >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Waiting for artifacts ($attempt/12): ${missing[*]}"
            fi
            sleep 5
          done
          echo '::error::The five build artifacts did not become available.'
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: release-assets
          merge-multiple: true

      - name: Fetch bundled esptool source
        shell: bash
        run: |
          tag=$(sed -n 's/^ESPTOOL = "\([^"]*\)"$/\1/p' scripts/fetch-tools.py)
          test -n "$tag"
          archive="release-assets/esptool-$tag-source.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://codeload.github.com/espressif/esptool/tar.gz/refs/tags/$tag"
          tar -tzf "$archive" >/dev/null

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(release-assets/ESP32-SuperFlash-*)
          if (( ${#packages[@]} != 6 )); then
            echo "::error::Expected six SuperFlash files after extraction, found ${#packages[@]}."
            printf 'Found package: %s\n' "${packages[@]}"
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$tag" --jq .sha)" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::The remote tag no longer points to the built commit.'
            exit 1
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" release-assets/* --clobber
              gh release edit "$tag" --draft=false
            else
              echo "Release $tag is already published."
            fi
          else
            gh release create "$tag" release-assets/* --verify-tag --generate-notes --title "$tag"
          fi
