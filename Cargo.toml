[package]
name = "esp32-superflash"
version = "0.4.5"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Native desktop workstation for ESP32 firmware flashing"

[dependencies]
anyhow = "1"
csv = "1.4"
directories = "6"
eframe = { version = "=0.33.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33", default-features = false }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1.1"
rfd = "0.16"
serialport = "4.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
tempfile = "3"
ttf-parser = "0.25"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
font-kit = "0.14.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "20.1"

[target.'cfg(target_os = "linux")'.dependencies]
dark-light = "3.0"
